services:
  - type: web
    name: connectx-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://connect-x-1af38.web.app
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
